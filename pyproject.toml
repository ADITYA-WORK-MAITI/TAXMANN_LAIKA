[project]
name = "laika"
version = "1.0.0"
description = "A question-answering assistant for PDF documents, built on Gemini, FAISS and BM25."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aditya Maiti" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
